<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - No Encontrado | Joel Bastone Lopez</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
  <!-- Styles -->
  <link rel="stylesheet" href="css/style.css">
  <style>
    body, html {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background-color: var(--bg-primary);
    }
    .error-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      width: 100vw;
      text-align: center;
      padding: 2rem;
      box-sizing: border-box;
      position: relative;
      z-index: 10;
    }
    .error-canvas-wrapper {
      position: relative;
      margin-bottom: 2rem;
      cursor: pointer;
    }
    .error-back-btn {
      margin-top: 2rem;
      z-index: 20;
    }
  </style>
</head>
<body>
  <main class="error-container">
    <div class="error-canvas-wrapper">
      <canvas id="fuzzy-404"></canvas>
    </div>
    <a href="index.html" class="hero-btn btn-primary error-back-btn">
      Volver al Inicio
    </a>
  </main>
  <script src="js/fuzzy-text.js"></script>
</body>
</html>
