<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Intelligent Domain Auto-Redirect (GitHub Pages -> joelbastonelopez.com) -->
  <script>
    (function() {
      if (window.location.hostname.includes('github.io')) {
        var p = window.location.pathname.replace(/^\/portfolio-web\/?/, '');
        window.location.replace('https://joelbastonelopez.com/' + p + window.location.search + window.location.hash);
      }
    })();
  </script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found | JBL</title>
  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="assets/img/favicon.ico" />
  <link rel="shortcut icon" href="assets/img/favicon.ico" />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
  <!-- Styles -->
  <link rel="stylesheet" href="css/style.css">
  <style>
    body, html {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background-color: var(--bg-primary);
    }
    .error-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      width: 100vw;
      text-align: center;
      padding: 2rem;
      box-sizing: border-box;
      position: relative;
      z-index: 10;
    }
    .error-canvas-wrapper {
      position: relative;
      margin-bottom: 2rem;
      cursor: pointer;
    }
    .error-back-btn {
      margin-top: 2rem;
      z-index: 20;
    }
  </style>
</head>
<body>
  <main class="error-container">
    <div class="error-canvas-wrapper">
      <canvas id="fuzzy-404"></canvas>
    </div>
    <a href="index.html" class="hero-btn btn-primary error-back-btn">
      Back to Home
    </a>
  </main>
  <script src="js/fuzzy-text.js"></script>
</body>
</html>
